[package]
name = "steam-rs"
version = "0.1.0"
edition = "2024"
publish = false
authors = ["escrow-tf"]
license = "Apache-2.0"

[dependencies]
type-state-builder = "0.5.0"
num_enum = "0.7.5"
derive_more = { version = "2.1.0", features = ["from", "into", "display"] }
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", features = ["json", "cookies", "multipart"] }
reqwest-middleware = { version = "0.4", features = ["json", "multipart"] }
reqwest-retry = "0.8"
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
form_urlencoded = "1.2"
serde_with = "3.16.1"

[build-dependencies]
prost-build = "0.14"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
todo = "forbid"
empty_loop = "forbid"
infinite_loop = "deny"
mem_forget = "deny"
