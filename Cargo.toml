[package]
name = "steam-rs"
version = "0.1.0"
edition = "2024"
publish = false
authors = ["escrow-tf"]
license = "Apache-2.0"

[workspace]
default-members = [
    ".",
]
members = [
    ".",
    "steam_encode",
    "steam_encode_derive",
]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
byteorder = "1.5"
bytes = "1.11"
chrono = "0.4.42"
derive_more = { version = "2.1.0", features = ["from", "into", "display"] }
form_urlencoded = "1.2"
hmac = "0.12"
num_enum = "0.7.5"
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", features = ["json", "cookies", "multipart"] }
reqwest-middleware = { version = "0.4", features = ["json", "multipart"] }
reqwest-retry = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_with = "3.16.1"
serde_json = "1.0"
serde_urlencoded = "0.7"
sha1 = "0.10"
type-state-builder = "0.5.0"
url = "2.5"
urlencoding = "2.1.3"
steam_encode = { path = "./steam_encode" }
steam_encode_derive = { path = "./steam_encode_derive" }
thiserror = "2.0"

[build-dependencies]
build-print = "1.0"
prost-build = "0.14"
prost-build-config = "0.6"
serde = { version = "1.0", features = ["derive"] }
toml = { version = "0.9.9", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
todo = "forbid"
empty_loop = "forbid"
infinite_loop = "deny"
mem_forget = "deny"
